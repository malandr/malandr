set -g mouse on
##### History #####
# Keep plenty of terminal output

set -g history-limit 100000

##### Terminal / colours #####
# Modern terminal capabilities
set -g default-terminal "tmux-256color"

# Enable true colour where supported
set -as terminal-features ",*:RGB"

# Renumber windows after one is closed

set -g renumber-windows on

# Split panes in the current directory

bind '"' split-window -v -c "#{pane_current_path}"

bind % split-window -h -c "#{pane_current_path}"

# New windows also inherit current directory

bind c new-window -c "#{pane_current_path}"

##### Easier pane navigation #####

# Ctrl-b + arrow without having to repeat Ctrl-b

bind -r Left  select-pane -L

bind -r Right select-pane -R

bind -r Up    select-pane -U

bind -r Down  select-pane -D

# Resize panes with Ctrl-b + Shift-arrow

bind -r S-Left  resize-pane -L 5

bind -r S-Right resize-pane -R 5

bind -r S-Up    resize-pane -U 5

bind -r S-Down  resize-pane -D 5

##### Faster command sequences #####

# Default is 500ms

set -sg escape-time 10

##### Status #####

# Update status line every 5 seconds

set -g status-interval 5

# Useful information on the right

set -g status-right '#H | %Y-%m-%d %H:%M'

##### Reload config #####

# Ctrl-b r

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
